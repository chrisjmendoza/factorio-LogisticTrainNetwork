[virtual-signal-description]
ltn-position-any-locomotive=Sent by an LTN stop while a train is parked: a bitmask of which carriage positions are locomotives (bit 0 = front of the train).
ltn-position-any-cargo-wagon=Sent by an LTN stop while a train is parked: a bitmask of which carriage positions are cargo wagons (bit 0 = front of the train).
ltn-position-any-fluid-wagon=Sent by an LTN stop while a train is parked: a bitmask of which carriage positions are fluid wagons (bit 0 = front of the train).
ltn-position-any-artillery-wagon=Sent by an LTN stop while a train is parked: a bitmask of which carriage positions are artillery wagons (bit 0 = front of the train).
ltn-position=Sent by an LTN stop while a train is parked: a bitmask of which carriage positions are this exact type (bit 0 = front of the train).
ltn-depot=Send 1 or more into a stop's lamp to make it a depot. Idle trains wait at depots; a train becomes an LTN train when it arrives at a depot in automatic mode with only the depot in its schedule. Also send a Network ID unless the default network is used.
ltn-depot-priority=Higher value = trains from this depot are chosen first. 0 is the default.
ltn-network-id=Which network(s) this stop belongs to. Networks are a bitmask: 1, 2, 4, 8 ... are separate networks, 3 = "1 and 2", -1 = all. Stops, depots and trains only work together within a shared network. Without this signal the 'Default network ID' map setting is used.
ltn-min-train-length=Trains shorter than this (locomotives + wagons) are not sent here. 0 = no limit.
ltn-max-train-length=Trains longer than this (locomotives + wagons) are not sent here. 0 = no limit.
ltn-max-trains=Maximum number of trains on their way to this stop at the same time. 0 = unlimited.
ltn-fuel-station=Send 1 or more to make this stop a fuel station (requires the 'Refuelling: enable fuel stations' map setting). Also send a Network ID and fuel item signals such as coal = 100, which set the refuel threshold.
ltn-requester-threshold=This stop only requests an item when its negative signal reaches this amount. Overrides the 'Request threshold' map setting (default 1000).
ltn-requester-stack-threshold=Same as 'LTN Request Threshold' but measured in stacks. Items only. Takes precedence over the item threshold.
ltn-requester-priority=Higher value = requests from this stop are served first. 0 is the default.
ltn-provider-threshold=This stop only offers an item when its positive signal reaches this amount. Overrides the 'Provide threshold' map setting (default 1000).
ltn-provider-stack-threshold=Same as 'LTN Provide Threshold' but measured in stacks. Items only. Takes precedence over the item threshold.
ltn-provider-priority=Higher value = this provider is chosen over others. 0 is the default.
ltn-locked-slots=Number of slots per cargo wagon that LTN will not fill. Use it when wagon slots are filtered or reserved.
ltn-disable-warnings=Send 1 or more to suppress 'no provider', 'no train' and similar chat messages for this stop.

[ltn-message]
error-duplicated-unit-number=[LTN] Error: Duplicated unit_number __1__.
error-stop-orientation=[LTN] Error: invalid train stop orientation __1__.
error-invalid-stop=[LTN] Error: invalid train stop __1__.
error-parse-item=[LTN] Error: could not parse item __1__.
error-no-stop=[LTN] Error: Couldn't get provider or requester stop.
error-stop-output-truncated=[LTN] Error: Inventory of train __2__ at stop __1__ exceeds stop output limit of __3__ by __4__ signals.
error-invalid-delivery=[LTN] Error: Removing invalid delivery from stop __1__
error-invalid-stop-index=[LTN] Error: Invalid stop unit_number __1__ in global.LogisticTrainStops.
error-invalid-request-index=[LTN] Error: Invalid index __1__ in global.Dispatcher.Requests.
error-invalid-position-signal=[LTN] Error: position signal __1__ does not exist.
error-invalid-schedule-record=[LTN] Error: Could not parse schedule record for __1__ / __2__ : __3__.

warning-dispatcher-disabled=[LTN] Warning: LTN is turned off, no new deliveries are created. Turn it on in Settings → Mod settings → Map → 'LTN active', or press Ctrl+Shift+D.
warning-no-depot-found=[LTN] Warning: train __1__ has no reachable depot in its network, so its schedule was cleared. Add a stop with the 'LTN Depot' signal (and a matching network ID) and send the train there.

empty-depot-item=[LTN] Requester __1__ wants __2__ but no free train with cargo wagons is parked at a depot in __3__. Park a train in automatic mode at a depot stop (a stop receiving the 'LTN Depot' signal) with only that depot in its schedule.
empty-depot-fluid=[LTN] Requester __1__ wants __2__ but no free train with fluid wagons is parked at a depot in __3__. Park a train in automatic mode at a depot stop (a stop receiving the 'LTN Depot' signal) with only that depot in its schedule.
no-depot-in-network=[LTN] Requester __1__ wants __2__ but there is no depot in __3__. Send the 'LTN Depot' signal (and a matching network ID) into a stop's lamp and park a train there.
no-network-id=[LTN] Requester __1__ wants __2__ but has no network ID (network 0), so nothing can serve it. Send an 'LTN Network ID' signal into the stop's lamp, or set Settings → Mod settings → Map → LTN → 'Default network ID' to 1.
no-provider-found=[LTN] Requester __1__: no stop currently provides __2__ in __3__. A provider needs a positive __2__ signal of at least __4__ (the provide threshold) and a network ID shared with the requester.
no-provider-available=[LTN] Requester __1__: __5__ stop(s) provide __2__ but none can be used in __3__: __4__.
provider-found=[LTN] Provider __1__: priority: __2__, deliveries: __3__, available: __4__ __5__.
no-train-found=[LTN] No free train available to carry cargo from __1__ to __2__ in __3__ (__4__). Trains must be parked at a depot in that network and must be able to reach the provider: check rail signals and the track from the depot.
train-length-any=any train length
train-length-min=at least __1__ carriages
train-length-max=at most __1__ carriages
train-length-range=__1__ to __2__ carriages
train-found=[LTN] Found train with capacity __4__ to transport __5__ from __1__ to __2__ in __3__.
creating-delivery=[LTN] Creating delivery from __1__ to __2__ in __5__ (__3__): __4__.
creating-delivery-merged=[LTN] Creating merged delivery from __1__ to __2__ in __5__ (__3__):  __4__ (total __6__).
delivery-removed-depot=[LTN] Delivery from __1__ to __2__ removed: the train returned to a depot before finishing it (manual redirect, or a depot stop in its schedule).
delivery-removed-train-invalid=[LTN] Delivery from __1__ to __2__ removed: the train no longer exists.
delivery-removed-timeout=[LTN] Delivery from __1__ to __2__ removed: the train has not reached its next stop for __3__ minutes (delivery timeout). It may be stuck, blocked by a signal, or out of fuel.

train-arrived=[LTN] __1__ arrived at __2__.
train-left=[LTN] __1__ departed from __2__.

provider_missing_cargo=[LTN] Train __1__ left provider __2__ with missing cargo. The stop timeout forced it out before loading finished. Check the inserters, wagon filters and the stop's buffer.
provider_unscheduled_cargo=[LTN] Train __1__ left provider __2__ with cargo that is not part of the delivery. Check the inserters and filters at the provider.
requester_unscheduled_cargo=[LTN] Train __1__ arrived at requester __2__ with cargo that is not part of the delivery. It was probably loaded by mistake at the provider.
requester_left_over_cargo=[LTN] Train __1__ left requester __2__ with cargo still on board. Unloading did not finish before the stop timeout, or the requester had no room. The leftovers stay on the train.
depot_left_over_cargo=[LTN] Train __1__ entered depot __2__ with cargo still on board. Unload it there, or enable 'Depot: discard leftover fluid' for fluids.

stop-short-circuit=[LTN] Stop __1__ is wired incorrectly: the stop, its lamp (input) and its combinator (output) share a circuit network. Connect your signals to the lamp only. The stop is ignored until this is fixed.
stop-disabled=[LTN] Stop __1__ has been disabled by a circuit condition and is ignored by LTN.
request-below-threshold=[LTN] Stop __1__ wants __2__ x __3__ but its request threshold is __4__, so nothing is delivered yet. Send an 'LTN Request Threshold' signal into the stop, or lower Settings → Mod settings → Map → LTN → 'Request threshold'.
train-at-stop-without-delivery=[LTN] Train __1__ stopped at LTN stop __2__ without a delivery. If this train should be run by LTN, give it a schedule with only a depot stop (a stop receiving the 'LTN Depot' signal) and set it to automatic.
stations-without-network-id=[LTN] These stops have no network ID (network 0) and are ignored: __1__

dispatcher-enabled=[LTN] Dispatcher enabled by __1__.
dispatcher-disabled=[LTN] Dispatcher disabled by __1__.

stop-uses-default-network=[LTN] Stop __1__ uses default network id.
stack=__plural_for_parameter__1__{0=no stacks|1=__1__ stack|rest=__1__ stacks}__
network=__plural_for_parameter__1__{0=no networks|1=network __2__|rest=networks __2__}__

