ltn_command_diagnose=Explain why an LTN stop is not working. Hover a stop (or open its GUI) and run the command, or pass the stop name. Without a target it prints a network summary.
diag_header=[LTN] Stop __1__ "__2__": __3__, __4__
diag_role_depot=Depot
diag_role_station=Provider / Requester
diag_role_fuel=Fuel station
diag_error_disabled=  - PROBLEM: the stop is wired incorrectly (stop, lamp and output share a circuit network) or disabled by a circuit condition. Wire signals to the lamp only.
diag_no_network=  - PROBLEM: no network ID (network 0). Send an 'LTN Network ID' signal into the lamp, or set the 'Default network ID' map setting to 1.
diag_provides=  - provides __1__ x __2__
diag_requests=  - requests __1__ x __2__
diag_below_provide=  - has __1__ x __2__, below the provide threshold of __3__ (not offered)
diag_below_request=  - wants __1__ x __2__, below the request threshold of __3__ (not requested)
diag_no_signals=  - no item or fluid signals reach the lamp. Wire a chest, tank or combinator to the lamp (the input next to the stop).
diag_thresholds=  - request threshold __1__, provide threshold __2__
diag_stack_thresholds=  - stack thresholds in use: request __1__ stacks, provide __2__ stacks
diag_length=  - train length limits: minimum __1__, maximum __2__ (0 = none)
diag_depots=  - depots in this network: __1__; free trains there: __2__ (__3__ with cargo wagons, __4__ with fluid wagons)
diag_no_depots=  - PROBLEM: no depot in this network. Send the 'LTN Depot' signal into a stop with a matching network ID and park a train there.
diag_no_trains=  - PROBLEM: no free train is parked at a depot in this network. Park a train in automatic mode with only the depot in its schedule.
diag_deliveries=  - trains on deliveries to or from this stop: __1__
diag_depot_train=  - parked train: __1__ (__2__)
diag_train_available=available for deliveries
diag_train_on_delivery=on a delivery
diag_train_not_registered=not registered: set the train to automatic with only this depot in its schedule
diag_depot_no_train=  - no train parked here. Park a train in automatic mode with only this depot in its schedule.
diag_fuel_signals=  - refuel thresholds: __1__
diag_fuel_no_signals=  - PROBLEM: no fuel item signals. Send for example coal = 100 into the lamp to set the refuel threshold.
diag_summary=[LTN] __1__ stops: __2__ depots, __3__ fuel stations, __4__ provider/requester stops. Free trains at depots: __5__. Deliveries running: __6__. Default network ID: __7__. LTN active: __8__.
