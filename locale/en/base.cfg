[mod-name]
LogisticTrainNetwork=LTN - Logistic Train Network

[mod-description]
LogisticTrainNetwork=Fully automated train logistics. Stops request and provide items or fluids through circuit signals, LTN picks a free train from a depot and writes its schedule. No manual train schedules needed.

[entity-name]
logistic-train-stop=Logistic Train Stop
logistic-train-stop-input=Logistic Train Stop Input (wire signals here)
logistic-train-stop-output=Logistic Train Stop Output
ltn-port=Logistic Port

[entity-description]
logistic-train-stop=An LTN stop. Wire your signals into the small lamp next to the stop (the input): a negative item or fluid count requests it, a positive count provides it. Send the 'LTN Depot' signal to turn the stop into a depot where idle trains wait. Hover the stop and run /ltn-diagnose if a train does not come.
ltn-port=An LTN port for ships. Works like a Logistic Train Stop: wire your signals into the lamp, negative counts request, positive counts provide.

