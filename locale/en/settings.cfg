[mod-setting-description]
ltn-stop-default-network=Network used by every stop that does not receive an 'LTN Network ID' signal.\n\n1 (default): all such stops share one network. Fine for most games.\n0: such stops belong to NO network and will never get a train. Use this only if every stop sends its own network ID.\n-1: all 32 networks.\n\nNetworks are a bitmask: 1, 2, 4, 8 ... are separate networks, 3 means "1 and 2".
ltn-dispatcher-requester-threshold=A stop only requests an item when its negative signal reaches this amount.\nExample: with 1000, a signal of -500 iron plate does nothing; -1000 creates a delivery.\n\nOverride per stop with the 'LTN Request Threshold' signal.\ndefault = 1000
ltn-dispatcher-provider-threshold=A stop only offers an item when its positive signal reaches this amount.\nExample: with 1000, a chest with 400 iron plate is not offered; 1000 or more is.\n\nOverride per stop with the 'LTN Provide Threshold' signal.\ndefault = 1000
ltn-interface-console-level=How much LTN tells you in chat.\n\n0: Off\n\n1: Errors & Warnings\nOnly problems (no provider, no train, wrong cargo ...).\n\n2: Notifications (default)\nProblems plus every delivery that is created.\n\n3: Detailed Messages\nEverything, including how providers and trains were chosen. Useful for debugging.
ltn-interface-console-messages=Show LTN messages in the chat for this player. Turn off to silence LTN for yourself only (useful in multiplayer).
ltn-interface-message-gps=Messages include a clickable map tag that jumps to the stop or train. Strongly recommended while learning LTN.
ltn-interface-factorio-alerts=Show LTN problems (no train, missing cargo, miswired stop ...) as Factorio alerts at the bottom of the screen, for this player.
ltn-dispatcher-enabled=When off, LTN stops creating new deliveries. Stops are still monitored and running deliveries finish.\nCan also be toggled with Ctrl+Shift+D.
ltn-dispatcher-depot-inactivity=A train at a depot waits this many seconds of inactivity before it may leave for a delivery.\ndefault = 5
ltn-dispatcher-stop-timeout=A train is forced to leave a provider or requester after this many seconds, even if loading or unloading is not finished. This produces a 'missing cargo' or 'left over cargo' alert, so if you see those, your inserters are too slow or filtered wrong.\n0 = never force trains out.\ndefault = 120
ltn-dispatcher-delivery-timeout=If a train does not reach its next stop within this many seconds, LTN assumes it is lost (destroyed, stuck, out of fuel) and cancels the delivery.\ndefault = 600 (10 min)
ltn-dispatcher-finish-loading=True (default):\nTrains wait for 2 seconds of inactivity after the cargo condition is met, so inserters and pumps can finish.\n\nFalse:\nTrains leave the moment the cargo condition is met. Inserters may be left holding items.
ltn-dispatcher-requester-delivery-reset=False (default):\nA delivery ends when the train arrives back at the depot. The schedule is not touched before that, so other mods (or you) can add stops after the requester.\n\nTrue:\nA delivery ends as soon as the train leaves the requester and its schedule is reset immediately.
ltn-schedule-reselect-depot=Only has an effect when 'Delivery completes at requester' is on. If enabled, the train picks a random depot in its network after each delivery instead of returning to the depot it started from. Can pile up trains in small depots.
ltn-depot-reset-filters=True (default):\nCargo wagon filters and inventory limits are cleared when a train enters a depot.
ltn-depot-fluid-cleaning=Fluid left in a train when it enters a depot is destroyed, up to this amount per wagon.\n0 = off (default), -1 = remove all fluid.
ltn-schedule-fuel-station=Let LTN send low-fuel trains to fuel stations.\nA fuel station is a stop that receives the 'LTN Fuel Station' signal, a network ID, and one or more fuel item signals (for example coal = 100) which set the refuel threshold.
ltn-fuel-station-interrupt=When on (default), refuelling is done with a Factorio train interrupt. Turn off only if the interrupt causes problems; LTN will then insert refuel stops into the schedule itself, which costs a bit more CPU.
ltn-schedule-reset-interrupts=Remove every interrupt from a train's schedule when it reaches a depot. Leave off if other mods add interrupts to your trains.
ltn-provider-show-existing-cargo=True (default):\nCargo already on the train when it arrives at a provider is included in the stop's output signals (including items held by inserters).
ltn-provider-ignore-stopped-train=False (default):\nWhile a train is unloading at a requester, its cargo counts as already delivered, so the next delivery is smaller.\n\nTrue:\nIgnore the unloading train and request the full amount again. Makes bulk deliveries more efficient but can over-deliver expensive items.
ltn-dispatcher-schedule-circuit-control=Adds the wait condition 'red = 0 OR green ≥ 1' to every provider and requester stop.\nWarning: every LTN stop then needs 'send to train' enabled and a circuit connection, or trains wait forever.\ndefault = false
ltn-depot-fudge-factor=When choosing between free trains, paths that differ by less than this distance count as equal and the train that was used least often is picked. 0 = always take the closest train.
ltn-advanced-cross-surface-delivery=Only for games where the train network spans connected surfaces (for example the Space Exploration space elevator). Lets LTN pick trains from other surfaces or send a train to another surface first to pick up a delivery. Leave off otherwise.
ltn-dispatcher-nth_tick=LTN runs every N ticks. Higher values spread the work out (better UPS) but stops and requests react more slowly.
ltn-dispatcher-stop-updates-per-tick=How many stops are updated per LTN run. Lower values reduce lag spikes. Forced to 1 when the update frequency is above 1.
ltn-dispatcher-updates-per-tick=How many requests are processed per LTN run. Lower values reduce lag spikes. Forced to 1 when the update frequency is above 1.
ltn-dispatcher-route-cache-lifetime=How long a computed route from a depot to a provider is remembered. Longer = fewer path lookups (better UPS); shorter = new tracks are used sooner. Leave at the default unless you see lag spikes.
ltn-limit-eligible-trains=How many free trains are checked for a path to the provider before one is picked. 0 = all. For very large networks with lag spikes, try 5-10.
ltn-interface-debug-logfile=Write LTN debug output to factorio-current.log. 0 = off. Most messages use level 5.
ltn-depot-stop-limit-trains=[font=default-semibold][color=red][EXPERIMENTAL!][/color][/font] Controls the behavior of the 'Train Limit' setting for LTN depot stops.

